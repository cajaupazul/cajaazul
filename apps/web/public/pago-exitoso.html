<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Completado! - CampusLink</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #151921;
            padding: 2rem;
            border-radius: 2rem;
            border: 1px solid #1e242e;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 4rem;
            color: #22c55e;
            margin-bottom: 1rem;
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; font-style: italic; }
        p { color: #94a3b8; margin: 1rem 0; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { margin-top: 2rem; font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 0.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>¡Pago <span style="color: #22c55e;">Exitoso</span>!</h1>
        <p>Tu transacción ha sido procesada perfectamente.</p>
        <div style="margin-top: 2rem;">
            <div class="spinner"></div>
            <span style="font-size: 0.9rem; color: #3b82f6; font-weight: bold;">Redirigiendo a CampusLink...</span>
        </div>
    </div>
    <div class="footer">CampusLink Secure Checkout</div>

    <script>
        // Esta página es ESTÁTICA para evitar errores 522.
        // Redirige al dashboard/store después de 2 segundos.
        setTimeout(() => {
            window.location.href = '/dashboard/store?status=success';
        }, 2500);
    </script>
</body>
</html>
